<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KantinNinGuys - Keranjang Belanja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandPink: '#ff758f',
                        brandLightPink: '#fff0f3',
                        brandSoftPink: '#ffb3c1',
                        brandBorder: '#ffccd5',
                        textDark: '#2d3748'
                    },
                    fontFamily: {
                        sans: ['Poppins', 'Quicksand', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/theme.js"></script>

<style> .hidden { display:none !important; } </style>

</head>
<body class="bg-gray-50 dark:bg-slate-900 text-textDark dark:text-gray-100 font-sans antialiased min-h-screen transition-colors duration-300 text-sm sm:text-base">

<!-- UI checkout/pembayaran: nomor WhatsApp, QRIS, Cash, dan upload bukti -->
<div id="page-checkout" class="hidden max-w-2xl mx-auto px-4 py-8">
  <a href="#cart" onclick="event.preventDefault(); showOrderPage('cart')" class="inline-block mb-4 text-sm font-semibold text-gray-600 dark:text-gray-300 hover:text-brandPink"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Keranjang</a>
  <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-gray-100 dark:border-slate-700 space-y-6">
    <h1 class="text-xl sm:text-2xl font-bold flex items-center border-b border-gray-100 dark:border-slate-700 pb-4"><i class="fa-solid fa-receipt text-brandPink mr-3"></i> Konfirmasi & Pembayaran</h1>
    <div>
      <label class="block font-semibold mb-1">Nomor WhatsApp Pemesan</label>
      <input type="tel" id="buyer-phone" placeholder="Contoh: 081234567890" class="w-full px-3.5 py-2.5 bg-gray-50 dark:bg-slate-700 border border-gray-300 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-brandPink focus:outline-none">
    </div>
    <div>
      <label class="block font-semibold mb-1.5">Metode Pembayaran</label>
      <div class="grid grid-cols-2 gap-3">
        <label class="cursor-pointer border border-gray-200 dark:border-slate-600 p-3 rounded-2xl flex items-center justify-center space-x-2 font-bold text-sm has-[:checked]:border-2 has-[:checked]:border-brandPink has-[:checked]:bg-brandLightPink/30 dark:has-[:checked]:bg-slate-700"><input type="radio" name="payment" value="QRIS" checked onchange="setPayment('QRIS')" class="accent-brandPink"><i class="fa-solid fa-qrcode text-brandPink"></i><span>QRIS</span></label>
        <label class="cursor-pointer border border-gray-200 dark:border-slate-600 p-3 rounded-2xl flex items-center justify-center space-x-2 font-bold text-sm has-[:checked]:border-2 has-[:checked]:border-brandPink has-[:checked]:bg-brandLightPink/30 dark:has-[:checked]:bg-slate-700"><input type="radio" name="payment" value="Cash" onchange="setPayment('Cash')" class="accent-brandPink"><i class="fa-solid fa-money-bill-wave text-emerald-500"></i><span>Cash (Tunai)</span></label>
      </div>
    </div>
    <div id="qris-section" class="bg-brandLightPink/40 dark:bg-slate-700/60 p-5 rounded-2xl border border-brandBorder dark:border-slate-600 space-y-4 text-center">
      <h3 class="font-bold">Scan QRIS KantinNinGuys</h3>
      <img src="qris-kantinninguys.png" alt="QRIS KantinNinGuys" class="max-w-[220px] mx-auto rounded-2xl shadow-md border-2 border-white dark:border-slate-600">
      <p class="text-xs text-gray-500 dark:text-gray-300">Scan QRIS di atas untuk membayar via Gopay/OVO/Dana/BCA/Bank lain.</p>
      <div class="text-left pt-2 border-t border-brandBorder/50 dark:border-slate-600">
        <label class="block text-xs font-bold mb-1"><i class="fa-solid fa-file-invoice-dollar text-brandPink mr-1"></i> Upload Bukti Pembayaran:</label>
        <input type="file" id="payment-proof" accept="image/*" onchange="validateProofFile(this)" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-semibold file:bg-brandPink file:text-white cursor-pointer">
      </div>
    </div>
    <div class="flex justify-between gap-3 bg-gray-50 dark:bg-slate-700/50 p-4 rounded-2xl"><span>Total Tagihan:</span><b id="final-total" class="text-brandPink text-lg">Rp 0</b></div>
    <button onclick="processOrder()" class="w-full bg-brandPink text-white py-3.5 rounded-2xl font-bold text-sm hover:bg-[#e05670] shadow-md flex items-center justify-center space-x-2"><i class="fa-solid fa-check-circle"></i><span>Bayar & Selesaikan Pesanan</span></button>
  </div>
</div>

<!-- halaman hasil checkout dan struk untuk konfirmasi pesanan -->
<div id="page-success" class="hidden max-w-md mx-auto px-4 py-12">
  <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-gray-100 dark:border-slate-700 space-y-4 text-center">
    <div class="w-16 h-16 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mx-auto text-3xl"><i class="fa-solid fa-check"></i></div>
    <h1 class="text-2xl font-bold">Pesanan Berhasil!</h1>
    <p class="text-xs text-gray-500 dark:text-gray-400">Tunjukkan struk digital ini ke kasir kantin atau pengantar pesanan Anda.</p>
    <div id="receipt-details" class="bg-gray-50 dark:bg-slate-700/50 p-4 rounded-2xl text-left space-y-2 text-xs sm:text-sm"></div>
    <a href="index.html" class="w-full bg-brandPink text-white py-3.5 rounded-2xl font-bold text-sm hover:bg-[#e05670] shadow-md flex items-center justify-center">Kembali ke Menu Utama</a>
  </div>
</div>

<script>
// UTILITAS BERSAMA: pembacaan localStorage dan navigasi cart/checkout/success
function readStorage(key, fallback) {
  try { const value = localStorage.getItem(key); return value ? JSON.parse(value) : fallback; }
  catch (error) { console.warn('Data localStorage tidak valid:', key, error); return fallback; }
}
function showOrderPage(page) {
  if (!['cart', 'checkout', 'success'].includes(page)) page = 'cart';
  if (page === 'checkout' && readStorage('kng_cart', []).length === 0) {
    alert('Keranjang masih kosong. Silakan pilih menu terlebih dahulu.'); page = 'cart';
  }
  ['cart','checkout','success'].forEach(name => {
    const section = document.getElementById('page-' + name);
    if (section) section.classList.toggle('hidden', name !== page);
  });
  window.scrollTo(0, 0);
  if (page === 'cart') renderCart();
  if (page === 'checkout') initCheckout();
  if (page === 'success') loadReceipt();
  if (location.hash !== '#' + page) history.replaceState(null, '', '#' + page);
}

// logika checkout dan pembayaran, validasi nomor, serta validasi/kompresi bukti QRIS
const $ = id => document.getElementById(id);
const rp = n => 'Rp ' + (Number(n) || 0).toLocaleString('id-ID');
let selectedPayment = 'QRIS';
let config = readStorage('kng_order_config', {total: 0});

function initCheckout() {
  config = readStorage('kng_order_config', {total: 0});
  $('final-total').innerText = rp(config.total);
  setPayment(selectedPayment);
}

function setPayment(method) {
  selectedPayment = method;
  document.querySelector(`[name=payment][value=${method}]`).checked = true;
  $('qris-section').classList.toggle('hidden', method !== 'QRIS');
}

// Bukti harus gambar < 3 MB
function validateProofFile(input) {
  const f = input.files[0];
  if (f && (!f.type.startsWith('image/') || f.size >= 3 * 1024 * 1024)) {
    alert('Bukti pembayaran harus berupa gambar dengan ukuran kurang dari 3 MB.');
    input.value = '';
  }
}

// Perkecil & kompres gambar agar muat di localStorage
const compressProofImage = file => new Promise((ok, fail) => {
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 1000 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = img.width * s; c.height = img.height * s;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    ok(c.toDataURL('image/jpeg', 0.7));
  };
  img.onerror = () => fail();
  img.src = URL.createObjectURL(file);
});

async function processOrder() {
  const phone = $('buyer-phone').value.trim();
  if (!readStorage('kng_cart', []).length) { alert('Keranjang masih kosong.'); return showOrderPage('cart'); }
  if (!/^[+0-9][0-9\s-]{7,18}$/.test(phone)) { alert('Isi nomor WhatsApp yang valid untuk notifikasi pesanan!'); return $('buyer-phone').focus(); }
  let proofImage = null;
  if (selectedPayment === 'QRIS') {
    const f = $('payment-proof').files[0];
    if (!f) return alert('Silakan unggah foto/screenshot bukti pembayaran QRIS Anda!');
    try { proofImage = await compressProofImage(f); } catch { return alert('Bukti pembayaran tidak dapat dibuka. Pilih file gambar lain.'); }
  }
  saveAndRedirect(phone, proofImage);
}

// menampilkan struk dari data pesanan terakhir
function loadReceipt() {
  const o = readStorage('kng_last_order', null);
  if (!o) { $('receipt-details').innerHTML = '<p class="text-center text-gray-500">Tidak ada data transaksi terakhir.</p>'; return; }
  const row = (a, b, c = '') => `<div class="flex justify-between gap-3 ${c}"><span>${a}</span><span>${b}</span></div>`;
  $('receipt-details').innerHTML =
    row('No. Pesanan:', o.id, 'border-b pb-2 mb-2 font-bold text-brandPink') + row('Waktu:', o.date) + row('No. WA:', o.phone) +
    row('Metode Bayar:', o.payment, 'border-b pb-2 mb-2') + '<b>Item Pesanan:</b>' +
    o.items.map(i => row(`${i.name} (x${i.qty})`, rp(i.price * i.qty))).join('') +
    row('Total Bayar:', rp(o.summary.total), 'font-bold border-t pt-2 text-brandPink');
}

// INTEGRASI BERSAMA: inisialisasi halaman dan navigasi berdasarkan hash URL
document.addEventListener('DOMContentLoaded', () => {
  const requested = location.hash.replace('#', '');
  showOrderPage(['cart', 'checkout', 'success'].includes(requested) ? requested : 'cart');
  setPayment('QRIS');
});
window.addEventListener('hashchange', () => {
  const requested = location.hash.replace('#', '');
  if (['cart', 'checkout', 'success'].includes(requested)) showOrderPage(requested);
});
</script>

</body>
</html>
