<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Pembayaran - Admin KantinNinGuys</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            text-align: center;
        }
        .nav-back {
            display: inline-block;
            margin-bottom: 15px;
            text-decoration: none;
            color: #ff758f;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        th {
            background-color: #ff758f; /* Warna tema KantinNinGuys */
            color: white;
        }
        .badge {
            padding: 5px 10px;
            border-radius: 15px;
            color: white;
            font-size: 11px;
            font-weight: bold;
        }
        .bg-menunggu { background-color: #f39c12; }
        .bg-berhasil { background-color: #2ecc71; }
        .bg-ditolak { background-color: #e74c3c; }
        
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin: 2px;
            color: white;
        }
        .btn-terima { background-color: #2ecc71; }
        .btn-tolak { background-color: #e74c3c; }
        .btn-bukti { background-color: #3498db; text-decoration: none; display: inline-block;}
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="nav-back">← Kembali ke Katalog</a>
        <h2>Kelola Pembayaran & Pesanan KantinNinGuys</h2>
        
        <table id="tabelPembayaran">
            <thead>
                <tr>
                    <th>ID Pesanan</th>
                    <th>No. WhatsApp</th>
                    <th>Metode</th>
                    <th>Total (Rp)</th>
                    <th>Waktu / Tanggal</th>
                    <th>Bukti Bayar</th>
                    <th>Status</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="dataPembayaran">
                <!-- Data akan dirender secara dinamis dari localStorage -->
            </tbody>
        </table>
    </div>

    <script>
        // 1. Pengecekan Akses Admin
        const userRole = localStorage.getItem('role') || 'admin'; 
        if (userRole !== 'admin') {
            alert("Akses Ditolak! Halaman ini khusus untuk Admin Kantin.");
            window.location.href = "index.html";
        }

        // 2. Mengambil data transaksi dari localStorage ('kng_history') yang dikirim pembeli
        function getAdminPayments() {
            const history = JSON.parse(localStorage.getItem('kng_history')) || [];
            
            // Jika localStorage kosong, sediakan data default yang hanya berisi QRIS & Tunai (Tanpa Transfer Bank)
            if (history.length === 0) {
                return [
                    { id: "KNG-100101", phone: "081234567890", payment: "QRIS", summary: { total: 25000 }, date: "26/10/2026 12:00:00", status: "menunggu", paymentProof: null },
                    { id: "KNG-100102", phone: "089876543210", payment: "Cash", summary: { total: 18000 }, date: "26/10/2026 12:30:00", status: "menunggu", paymentProof: null }
                ];
            }

            // Pastikan setiap data dari riwayat memiliki status default 'menunggu' jika belum diverifikasi admin
            return history.map(item => ({
                ...item,
                status: item.status || "menunggu"
            }));
        }

        // 3. Fungsi untuk menampilkan data ke tabel admin
        function renderTabel() {
            const tbody = document.getElementById("dataPembayaran");
            const payments = getAdminPayments();
            tbody.innerHTML = ""; 

            if (payments.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#777; padding:20px;">Belum ada transaksi masuk.</td></tr>`;
                return;
            }

            payments.forEach((payment, index) => {
                let currentStatus = payment.status || "menunggu";
                let badgeClass = currentStatus === 'menunggu' ? 'bg-menunggu' : 
                                 currentStatus === 'berhasil' ? 'bg-berhasil' : 'bg-ditolak';
                
                let totalAmount = payment.summary ? payment.summary.total : (payment.total || 0);
                let paymentMethod = payment.payment || 'QRIS'; // Hanya QRIS atau Cash/Tunai
                
                // Tombol Lihat Bukti Bayar (jika ada file gambar QRIS)
                let buktiBtn = payment.paymentProof 
                    ? `<a href="${payment.paymentProof}" target="_blank" class="btn btn-bukti">Lihat Bukti</a>` 
                    : `<span style="color:#999; font-size:12px;">Tanpa Bukti (Tunai)</span>`;

                // Tombol Aksi Terima/Tolak
                let actionButtons = "";
                if(currentStatus === "menunggu") {
                    actionButtons = `
                        <button class="btn btn-terima" onclick="updateStatus('${payment.id}', 'berhasil')">Terima</button>
                        <button class="btn btn-tolak" onclick="updateStatus('${payment.id}', 'ditolak')">Tolak</button>
                    `;
                } else {
                    actionButtons = `<span>Selesai</span>`;
                }

                const row = `<tr>
                                <td><b>${payment.id}</b></td>
                                <td>${payment.phone || '-'}</td>
                                <td>${paymentMethod}</td>
                                <td>Rp ${totalAmount.toLocaleString('id-ID')}</td>
                                <td>${payment.date || '-'}</td>
                                <td>${buktiBtn}</td>
                                <td><span class="badge ${badgeClass}">${currentStatus.toUpperCase()}</span></td>
                                <td>${actionButtons}</td>
                             </tr>`;
                tbody.innerHTML += row;
            });
        }

        // 4. Fungsi untuk memperbarui status pembayaran dan menyimpannya ke localStorage
        function updateStatus(orderId, statusBaru) {
            const confirmMsg = statusBaru === 'berhasil' ? "Terima pembayaran pesanan ini?" : "Tolak pembayaran pesanan ini?";
            if(confirm(confirmMsg)) {
                let history = JSON.parse(localStorage.getItem('kng_history')) || [];
                const index = history.findIndex(p => p.id === orderId);
                
                if(index !== -1) {
                    history[index].status = statusBaru;
                    localStorage.setItem('kng_history', JSON.stringify(history));
                    renderTabel(); 
                    alert("Status pembayaran berhasil diperbarui!");
                } else {
                    alert("Data transaksi tidak ditemukan di penyimpanan lokal.");
                }
            }
        }

        // Muat tabel saat halaman dibuka
        renderTabel();
    </script>
</body>
</html>
