<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Pesanan 🌸 - KantinNinGuys</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastelPink: '#fff0f3',
                        softPink: '#ffb3c1',
                        deepPink: '#ff758f',
                        cutePeach: '#ffccd5',
                        textDark: '#4a403b'
                    },
                    fontFamily: { sans: ['Quicksand', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-pastelPink text-textDark min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-cutePeach shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="w-10 h-10 bg-pastelPink text-deepPink rounded-full flex items-center justify-center font-bold hover:bg-deepPink hover:text-white transition-all shadow-sm" title="Kembali ke Katalog">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1 class="text-xl font-bold text-deepPink">Riwayat & Status Pesanan 📦✨</h1>
            </div>
            <button onclick="clearHistory()" class="text-xs bg-red-100 text-red-500 font-bold px-3 py-1.5 rounded-xl hover:bg-red-500 hover:text-white transition-all">
                <i class="fa-solid fa-trash mr-1"></i> Hapus Riwayat
            </button>
        </div>
    </header>

    <!-- Content -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        <div id="orders-container" class="space-y-4">
            <!-- Tempat daftar riwayat pesanan akan dirender secara dinamis -->
        </div>
    </main>

    <footer class="bg-white border-t border-cutePeach py-6 text-center text-xs text-gray-500">
        <p>KantinNinGuys Campus Canteen © 2026</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderOrderHistory();
        });

        function renderOrderHistory() {
            const container = document.getElementById('orders-container');
            const orders = JSON.parse(localStorage.getItem('kantinNinGuysOrders')) || [];

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl p-10 text-center border-2 border-cutePeach shadow-sm">
                        <div class="text-6xl mb-4">🛍️</div>
                        <h3 class="text-lg font-bold text-deepPink mb-1">Belum Ada Pesanan</h3>
                        <p class="text-xs text-gray-400 mb-6">Kamu belum pernah melakukan pesanan makanan atau minuman di KantinNinGuys.</p>
                        <a href="index.html" class="bg-deepPink text-white font-bold text-xs px-6 py-3 rounded-full hover:bg-[#e05670] transition-all inline-block shadow">
                            Mulai Jajan Sekarang ✨
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="bg-white rounded-3xl p-6 shadow-sm border-2 border-cutePeach flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <span class="text-xs font-bold bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full">${order.status}</span>
                        <h3 class="font-bold text-lg mt-2">No. Pesanan: ${order.orderId}</h3>
                        <p class="text-xs text-gray-500 mt-1">${order.itemsSummary}</p>
                        <p class="text-xs text-gray-400 mt-1">Dipesan pada: ${order.date}</p>
                    </div>
                    <div class="text-right w-full md:w-auto border-t md:border-t-0 pt-3 md:pt-0 border-gray-100">
                        <span class="text-xs text-gray-400 block">Total Pembayaran</span>
                        <span class="text-deepPink font-extrabold text-lg">Rp ${order.totalPrice.toLocaleString('id-ID')}</span>
                        <span class="block text-xs text-emerald-600 font-semibold mt-1">Pembayaran: Berhasil 💳</span>
                    </div>
                </div>
            `).join('');
        }

        function clearHistory() {
            if (confirm('Apakah Kakak yakin ingin mengosongkan seluruh riwayat pesanan? 🗑️')) {
                localStorage.removeItem('kantinNinGuysOrders');
                renderOrderHistory();
            }
        }
    </script>
</body>
</html>
